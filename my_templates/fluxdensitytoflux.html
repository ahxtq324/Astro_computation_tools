<!DOCTYPE html>
<html>
<head>
    <title>Convert flux density to flux</title>
</head>
<body>
    <h2>Convert Flux density (F<sub>&nu;</sub>) at E<sub>0</sub> keV to Integrated X-ray Flux (F) in E<sub>l</sub> - E<sub>h</sub> keV energy range</h2>
    <form action="{{ url_for('fluxdensitytoflux') }}" method="POST">
        <table>
            <tr>
                <td><label for="ene_fldens">E<sub>0</sub> keV at which F<sub>&nu;</sub> is evaluated</label></td>
                <td><input type="number" id= "ene_fldens" name="ene_fldens" step="any" required></td>
            </tr>
            <tr>
                <td><label for="F_nu">F<sub>&nu;</sub> [mJy]</label></td>
                <td><input type="number" id= "F_nu" name="F_nu" step="any" required></td>
            </tr>
            <tr>
                <td><label for="Fnu_perr">Postive Error on F<sub>&nu;</sub></label></td>
                <td><input type="number" id= "Fnu_perr" name="Fnu_perr" step="any" required></td>
            </tr>
            <tr>
                <td><label for="Fnu_nerr">Negative Error on F<sub>&nu;</sub></label></td>
                <td><input type="number" id= "Fnu_nerr" name="Fnu_nerr" step="any" required></td>
            </tr>
            <tr>
                <td><label for="ene_low">Lower energy bound for the integrated flux [E<sub>l</sub> keV]</label></td>
                <td><input type="number" id= "ene_low" name="ene_low" step="any" required></td>
            </tr>
            <tr>
                <td><label for="ene_high">Higher energy bound for the integrated flux [E<sub>h</sub> keV]</label></td>
                <td><input type="number" id= "ene_high" name="ene_high" step="any" required></td>
            </tr>
            <tr>
                <td><label for="spidx">Spectral index</label></td>
                <td><input type="number" id= "spidx" name="spidx" step="any" required></td>
            </tr>
        </table>
        <input type="submit" value="Calculate away!">
    </form>
    {% if result %}
    <h3>Result:</h3>
    <div style="white-space: pre-line;">{{ result }}</div>
    {% endif %}
</body>
</html>
