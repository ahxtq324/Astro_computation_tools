<!DOCTYPE html>
<html>
<head>
    <title>Convert Optical magnitudes to Luminosity</title>
</head>
<body>
    <h1>Convert Flux (F) to Flux density (F<sub>&nu;</sub>)</h1>
    <form action="{{ url_for('fluxtofluxdensity') }}" method="POST">
        <table>
            <tr>
                <td><label for="F">Integrated Unabsorbed Flux [erg/cm<sup>2</sup>sup>/s]</label></td>
                <td><input type="number" id= "F" name="F" step="any" required></td>
            </tr>
            <tr>
                <td><label for="F_perr">Postive Error on F</label></td>
                <td><input type="number" id= "F_perr" name="F_perr" step="any" required></td>
            </tr>
            <tr>
                <td><label for="F_nerr">Negative Error on F</label></td>
                <td><input type="number" id= "F_nerr" name="F_nerr" step="any" required></td>
            </tr>
            <tr>
                <td><label for="ene_low">Lower energy bound of the integrated flux [keV]</label></td>
                <td><input type="number" id= "ene_low" name="ene_low" step="any" required></td>
            </tr>
            <tr>
                <td><label for="ene_high">Higher energy bound of the integrated flux [keV]</label></td>
                <td><input type="number" id= "ene_high" name="ene_high" step="any" required></td>
            </tr>
            <tr>
                <td><label for="ene_fldens">Energy at which F<sub>&nu;</sub> is to be calculated</label></td>
                <td><input type="number" id= "ene_fldens" name="ene_fldens" step="any" required></td>
            </tr>
            <tr>
                <td><label for="gamma">Best-fitting X-ray photon index</label></td>
                <td><input type="number" id= "gamma" name="gamma" step="any" required></td>
            </tr>
        </table>
        <input type="submit" value="Calculate">
    </form>
    {% if result %}
    <h2>Result (in mJy): {{ result }}</h2>
    {% endif %}
</body>
</html>
